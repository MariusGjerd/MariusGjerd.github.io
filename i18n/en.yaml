  other: "In short"
lab.wheatstone-pt100.summaryBody:
  other: "<p>The bridge is two voltage dividers side by side. At 0 °C both midpoints sit at the same voltage, so the output is 0. When the sensor heats up, its resistance grows and the right midpoint rises. That small difference is the signal: about 52 mV at 100 °C.</p><p>A plain Arduino input sees only about 11 steps of it and nothing below 0 V. The ADS1115 measures between A and B, so it sees thousands of steps in both directions.</p>"

lab.wheatstone-pt100.circuitLabel:
  other: "Wheatstone bridge on 3.3 V. Left side: R1 2.2 kΩ over R2 100 Ω, midpoint A. Right side: R3 2.2 kΩ over the PT100 sensor, midpoint B. The output voltage is measured between A and B."

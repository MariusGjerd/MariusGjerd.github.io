lab.wheatstone-pt100.circuitLabel:
  other: "Wheatstone-bro på 3,3 V. Til venstre sitter R1 på 2,2 kΩ over R2 på 100 Ω, med midtpunkt A. Til høyre sitter R3 på 2,2 kΩ over PT100-sensoren, med midtpunkt B. Utgangsspenningen måles mellom A og B."

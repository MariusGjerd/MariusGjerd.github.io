lab.wheatstone-pt100.summaryBody:
  other: "<p>Broen består av to spenningsdelere. Ved 0 °C ligger A og B på samme spenning, og broen gir 0 V ut. Blir sensoren varmere, øker motstanden, og B kryper oppover. Forskjellen mellom A og B er signalet. Ved 100 °C er den rundt 52 mV.</p><p>Analoginngangen på en Arduino får bare rundt 11 trinn ut av dette, og ingenting under 0 V. ADS1115 måler mellom A og B og får flere tusen trinn, både over og under null.</p>"

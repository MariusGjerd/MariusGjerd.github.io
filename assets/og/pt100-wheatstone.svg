<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="150" height="150" patternUnits="userSpaceOnUse">
      <path d="M 150 0 L 0 0 0 150" fill="none" stroke="rgba(0,0,0,0.10)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- paper -->
  <rect width="1200" height="630" fill="#fbfbf9"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#gridBig)"/>

  <!-- signal bar -->
  <rect x="0" y="0" width="1200" height="8" fill="#2f6fdd"/>

  <!-- corner registration marks -->
  <path d="M 40 62 L 40 40 L 62 40" fill="none" stroke="#2f6fdd" stroke-width="3"/>
  <path d="M 1160 568 L 1160 590 L 1138 590" fill="none" stroke="#2f6fdd" stroke-width="3"/>

  <!-- kicker -->
  <text x="80" y="88" font-family="Menlo, monospace" font-size="22" letter-spacing="3" fill="#2f6fdd">IT/OT FIELD NOTES</text>
  <text x="1120" y="88" text-anchor="end" font-family="Menlo, monospace" font-size="22" letter-spacing="3" fill="#6a6d6f">LAB &#183; SENSORS</text>

  <!-- title -->
  <text x="78" y="250" font-family="Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#1a1a1b">WHY YOUR PT100</text>
  <text x="78" y="345" font-family="Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="#1a1a1b">LIVES IN A BRIDGE</text>
  <text x="82" y="405" font-family="Helvetica, Arial, sans-serif" font-size="34" fill="#6a6d6f">0.385 ohms per degree, and how to see it</text>

  <!-- Wheatstone-bro med PT100 -->
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M 1040 150 L 950 280" stroke="#a8642a"/>
    <path d="M 1040 150 L 1130 280" stroke="#a8642a"/>
    <path d="M 950 280 L 1040 410" stroke="#a8642a"/>
    <path d="M 1130 280 L 1040 410" stroke="#d4600a"/>
    <path d="M 950 280 L 1130 280" stroke="#2f6fdd" stroke-width="3" stroke-dasharray="10 8"/>
  </g>
  <g stroke-width="5">
    <rect x="982" y="197" width="26" height="54" fill="#fbfbf9" stroke="#a8642a" transform="rotate(34.7 995 215)"/>
    <rect x="1072" y="197" width="26" height="54" fill="#fbfbf9" stroke="#a8642a" transform="rotate(-34.7 1085 215)"/>
    <rect x="982" y="318" width="26" height="54" fill="#fbfbf9" stroke="#a8642a" transform="rotate(-34.7 995 345)"/>
    <rect x="1072" y="318" width="26" height="54" fill="#d4600a" stroke="#d4600a" transform="rotate(34.7 1085 345)"/>
  </g>
  <circle cx="1040" cy="280" r="20" fill="#fbfbf9" stroke="#2f6fdd" stroke-width="3"/>
  <text x="1040" y="288" text-anchor="middle" font-family="Menlo, monospace" font-size="22" font-weight="700" fill="#2f6fdd">V</text>
  <circle cx="1040" cy="150" r="7" fill="#1a1a1b"/><circle cx="1040" cy="410" r="7" fill="#1a1a1b"/>
  <circle cx="950" cy="280" r="7" fill="#2f6fdd"/><circle cx="1130" cy="280" r="7" fill="#2f6fdd"/>
  <text x="1112" y="402" font-family="Menlo, monospace" font-size="20" fill="#d4600a">PT100</text>

  <!-- byline -->
  <text x="80" y="592" font-family="Menlo, monospace" font-size="21" letter-spacing="1" fill="#1a1a1b">MARIUS GJERD &#183; MARIUSGJERD.GITHUB.IO</text>
  <text x="1120" y="592" text-anchor="end" font-family="Menlo, monospace" font-size="21" letter-spacing="1" fill="#6a6d6f">BERGEN 60.39&#176;N</text>
</svg>

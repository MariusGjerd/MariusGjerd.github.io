Title = "Hi, I'm Marius"
Content = "Developer in Bergen, working at the bridge between IT and OT. I started out as an electrician, moved into software, and these days I build IoT in the energy sector. I write here when I have something worth sharing.\n\n**Currently:** starting a 3-year Industrial Automation degree this autumn, and writing up what I learn about sensor data you can (and can't) trust."
